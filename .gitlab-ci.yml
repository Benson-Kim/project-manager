# CI/CD for the Project Manager rebuild.
# Feature branches: lint + typecheck + test + build (+ manual e2e).
# develop/main: + e2e, security scans, deploys (staging auto / prod manual).
# Schedules (set SCHEDULE_JOB): backup | audit | renovate.
# Manual utilities: verify:sources (source-extraction re-verification, opt-in
#                   via "[verify]" in the commit message),
#                   lockfile:generate (bootstrap/refresh package-lock.json).

stages:
  - lint
  - typecheck
  - test
  - build
  - security
  - backup
  - deploy

workflow:
  rules:
    # Branch pipelines only (avoids MR/branch duplicates), plus schedules.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH

include:
  # Security scans only on develop/main (feature branches stay lean).
  - template: Jobs/SAST.gitlab-ci.yml
    rules:
      - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
  - template: Jobs/Secret-Detection.gitlab-ci.yml
    rules:
      - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
    rules:
      - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"

default:
  image: node:22
  interruptible: true

.node:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # npm ci for reproducible installs (package-lock.json is committed).
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

lint:
  extends: .node
  stage: lint
  script:
    - npm run lint
    - npm run format:check

typecheck:
  extends: .node
  stage: typecheck
  script:
    - npm run typecheck

test:
  extends: .node
  stage: test
  script:
    - npm run test

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - .next/standalone
      - .next/static

# Browser smoke tests: automatic on develop/main, manual on feature branches.
# Module #4 gates every app route behind login, so the job seeds a real SQL
# Server 2022 service (E2E_SEED=1 -> db/seed/028 e2e users) and provides the
# app env. All credential values below are job-scoped throwaways for the
# ephemeral service container and test users only — they die with the job
# (same rationale as db:apply); real hosts use masked CI variables.
e2e:
  extends: .node
  stage: test
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_PID: Developer
  variables:
    MSSQL_SA_PASSWORD: "E2e-Throwaway-Sa-2026!"
    DB_SERVER: mssql
    DB_USER: sa
    DB_PASSWORD: "E2e-Throwaway-Sa-2026!"
    DB_NAME: ProjectManager
    SEED_ADMIN_PASSWORD: "Throwaway-Admin-Seed-2026"
    E2E_SEED: "1"
    E2E_USER_PASSWORD: "E2e-Throwaway-User-2026"
    AUTH_SECRET: "e2e-throwaway-auth-secret-0123456789abcdefghijklmnopqrstuvwxyz"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gnupg2
    - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    - echo "deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql.list
    - apt-get update -qq && ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 && ln -sf /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - for i in $(seq 1 30); do sqlcmd -S tcp:mssql,1433 -U sa -P "$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break; echo "waiting for SQL Server ($i)"; sleep 2; done
  script:
    - sh scripts/db-apply.sh
    - npx playwright install --with-deps chromium
    - npm run e2e
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - test-results/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RUN_E2E == "1"                # api-triggered: run automatically
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    # Opt-in on feature branches without needing API/variable privileges:
    # put "[e2e]" anywhere in the commit message.
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[e2e\]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# ---- manual utilities --------------------------------------------------------

# Emit a prettier patch via the job trace when the workspace proxy blocks npm
# locally (agent tokens cannot download artifacts, but can read traces).
# Opt-in: "[format]" in the commit message. Apply locally:
#   scrape between the markers -> base64 -d | gzip -d > prettier.patch
#   git apply prettier.patch
format:patch:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[format\]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - npx prettier --write . || true
    - git diff > prettier.patch
    - echo "-----BEGIN PRETTIER PATCH B64-----"
    - gzip -9 -c prettier.patch | base64 -w 120
    - echo "-----END PRETTIER PATCH B64-----"
  artifacts:
    expire_in: 3 days
    paths:
      - prettier.patch

# Regenerate package-lock.json when the workspace proxy blocks npm locally.
# Download the artifact and commit it.
lockfile:generate:
  stage: build
  # Run even when earlier stages fail — a fresh lockfile is exactly what an
  # out-of-sync npm ci failure needs.
  needs: []
  rules:
    - if: $LOCKFILE_ONLY == "1"          # api-triggered: run automatically
    # Opt-in refresh after editing package.json: "[lockfile]" in the commit message.
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[lockfile\]/
    # With a committed lockfile, refreshing is a manual utility…
    - if: $CI_COMMIT_BRANCH
      exists:
        paths: [package-lock.json]
      when: manual
      allow_failure: true
    # …but while no lockfile exists yet, bootstrap it automatically.
    - if: $CI_COMMIT_BRANCH
  cache: []
  script:
    - npm install --package-lock-only --no-audit --no-fund
    - npm audit --omit dev || true
    # Version report: is anything pinned behind latest stable? (the agent
    # workspace proxy blocks npmjs.org, so this job is the version oracle)
    - npm outdated --long || true
    - npm view eslint version && npm view typescript version || true
    - npm info eslint-config-next@latest peerDependencies || true
    - npm info typescript-eslint@latest peerDependencies || true
    # Emit the lockfile into the trace too: agent workspace tokens cannot
    # download artifacts, but they can read job traces (glab api …/trace).
    - echo "-----BEGIN LOCKFILE B64-----"
    - gzip -9 -c package-lock.json | base64 -w 120
    - echo "-----END LOCKFILE B64-----"
  artifacts:
    expire_in: 3 days
    paths:
      - package-lock.json

# Re-verify docs/source/analysis against the three binary artefacts
# (mdbtools + openpyxl + python-pptx; see docs/source/analysis/VERIFICATION.md).
verify:sources:
  stage: test
  image: python:3.12-bookworm
  cache: []
  rules:
    # Opt-in: "[verify]" anywhere in the commit message (agent tokens cannot
    # play manual jobs); still available manually on any branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[verify\]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq mdbtools
    - pip install --quiet openpyxl python-pptx
  script:
    - python tools/verify/verify_sources.py
  artifacts:
    paths: [verify-report.txt]
    when: always
    expire_in: 1 week

# Prove the database module on a clean SQL Server 2022 container: apply
# migrations + procs + seeds via scripts/db-apply.sh (twice — idempotence is
# asserted, not assumed) and verify row counts match the
# docs/source/analysis/access-database.md §4 inventory (db/verify/seed_counts.sql).
# Opt-in: "[db]" in the commit message; automatic on develop/main when db files
# change; manual utility otherwise.
db:apply:
  stage: test
  needs: []
  cache: []
  interruptible: true
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_PID: Developer
  variables:
    # Job-scoped throwaway password for the ephemeral service container only
    # (never a real host — those use the MSSQL_SA_PASSWORD CI variable).
    MSSQL_SA_PASSWORD: "Ci-Ephemeral!Passw0rd1"
    DB_SERVER: mssql
    DB_USER: sa
    DB_PASSWORD: "Ci-Ephemeral!Passw0rd1"
    # Job-scoped throwaway seed password for the ephemeral service DB only
    # (same rationale as the SA password above — the seeded hash dies with the
    # container). Real hosts provide SEED_ADMIN_PASSWORD via a masked variable.
    SEED_ADMIN_PASSWORD: "Throwaway-Admin-Seed-2026"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /\[db\]/
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - db/**/*
          - scripts/db-apply.sh
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gnupg2
    - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    - echo "deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql.list
    - apt-get update -qq && ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 && ln -sf /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd
    # wait for the service container to accept connections
    - for i in $(seq 1 30); do sqlcmd -S tcp:mssql,1433 -U sa -P "$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break; echo "waiting for SQL Server ($i)"; sleep 2; done
  script:
    # argon2 for scripts/hash-password.mjs (seed-time admin hash; node:22 image)
    - npm install --no-save --no-audit --no-fund argon2
    - sh scripts/db-apply.sh
    - echo "== second run (idempotence) ==" && sh scripts/db-apply.sh
    - sqlcmd -S tcp:mssql,1433 -U sa -P "$DB_PASSWORD" -C -b -I -i db/verify/seed_counts.sql

# ---- scheduled maintenance ---------------------------------------------------

# SCHEDULE_JOB=audit — automatic vulnerability fixing: runs `npm audit fix`,
# and if anything changed, pushes a branch and opens an MR to develop.
# Requires PROJECT_TOKEN (project access token, api+write_repository, role
# Developer+) as a CI/CD variable. Falls back to report-only without it.
npm-audit-fix:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "audit"
  cache: []
  script:
    - git checkout -B develop origin/develop || git checkout develop
    - npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    - npm audit --json > npm-audit.json || true
    - npm audit || true
    - npm audit fix || true
    - |
      if git diff --quiet -- package.json package-lock.json; then
        echo "No fixable vulnerabilities — nothing to do."
        exit 0
      fi
      if [ -z "${PROJECT_TOKEN:-}" ]; then
        echo "Changes available but PROJECT_TOKEN is not set — report-only mode."
        git diff -- package.json package-lock.json | head -100
        exit 0
      fi
      BRANCH="duo/update/audit-fix-$(date -u +%Y%m%d)"
      git config user.name  "npm-audit-bot"
      git config user.email "audit-bot@users.noreply.gitlab.com"
      git checkout -B "$BRANCH"
      git add package.json package-lock.json
      git commit -m "fix(deps): npm audit fix ($(date -u +%Y-%m-%d))"
      git push -f "https://gitlab-ci-token:${PROJECT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
      curl --fail --silent --request POST \
        --header "PRIVATE-TOKEN: ${PROJECT_TOKEN}" \
        --data-urlencode "source_branch=$BRANCH" \
        --data-urlencode "target_branch=develop" \
        --data-urlencode "title=fix(deps): npm audit fix $(date -u +%Y-%m-%d)" \
        --data-urlencode "description=Automated \`npm audit fix\` from the scheduled security pipeline. Review the audit report artifact of job $CI_JOB_URL." \
        --data-urlencode "remove_source_branch=true" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" || echo "MR may already exist"
  artifacts:
    expire_in: 30 days
    paths:
      - npm-audit.json
  allow_failure: true

# SCHEDULE_JOB=renovate — self-hosted Renovate (zero-cost; renovate.json config).
# Requires RENOVATE_TOKEN (project access token, api+write_repository) and
# optionally GITHUB_COM_TOKEN (higher changelog rate limits).
renovate:
  stage: security
  image: renovate/renovate:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "renovate" && $RENOVATE_TOKEN
  cache: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
    - renovate $CI_PROJECT_PATH
  allow_failure: true

# ---- scheduled backup (zero-cost: Generic Package Registry) -------------------
# SCHEDULE_JOB=backup + MSSQL_SA_PASSWORD CI variable. In this pipeline the DB
# is the ephemeral service seeded by db-apply.sh — it proves the FULL chain
# (backup -> registry upload -> NORECOVERY restore chain -> sanity queries)
# on every run. Point DB_SERVER/DB_* variables at the real staging/prod host
# once one exists to back up real data with the exact same job.
backup:
  stage: backup
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_JOB == "backup" && $MSSQL_SA_PASSWORD
  cache: []
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_PID: Developer
  variables:
    DB_SERVER: mssql
    DB_USER: sa
    DB_PASSWORD: $MSSQL_SA_PASSWORD
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gnupg2 xxd
    - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    - echo "deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql.list
    - apt-get update -qq && ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 && ln -sf /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd
    - sh scripts/db-apply.sh   # seed the ephemeral service DB before the backup demo
  script:
    - sh scripts/backup.sh
    - sh scripts/restore-rehearsal.sh   # backups are only real if restores are tested
  artifacts:
    expire_in: 14 days
    paths:
      - backups/

# ---- deploys -------------------------------------------------------------------
deploy-staging:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: staging
  script:
    - echo "Deploy to staging (target infra defined in a later module)."
    - echo "Artifacts from the build stage are ready in .next/standalone."

deploy-prod:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
  script:
    - echo "Deploy to production (manual gate; target infra defined in a later module)."
