name: Scheduled Database Backup & Restore Rehearsal

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  db-backup-rehearsal:
    name: Database Backup & Restore Rehearsal
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD || 'Backup-Rehearsal-Sa-2026!' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install sqlcmd & tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg2 xxd
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" | sudo tee /etc/apt/sources.list.d/mssql.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          sudo ln -sf /opt/mssql-tools18/bin/sqlcmd /usr/local/bin/sqlcmd

      - name: Wait for SQL Server
        env:
          DB_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD || 'Backup-Rehearsal-Sa-2026!' }}"
        run: |
          for i in $(seq 1 30); do
            sqlcmd -S tcp:localhost,1433 -U sa -P "$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1 && break
            echo "Waiting for SQL Server ($i)..."
            sleep 2
          done

      - name: Install dependencies & seed database
        env:
          DB_SERVER: localhost
          DB_USER: sa
          DB_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD || 'Backup-Rehearsal-Sa-2026!' }}"
          SEED_ADMIN_PASSWORD: "Backup-Rehearsal-Admin-2026"
        run: |
          npm ci --prefer-offline
          npm install --no-save argon2
          sh scripts/db-apply.sh

      - name: Run Backup Script
        env:
          DB_SERVER: localhost
          DB_USER: sa
          DB_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD || 'Backup-Rehearsal-Sa-2026!' }}"
        run: sh scripts/backup.sh

      - name: Run Restore Rehearsal
        env:
          DB_SERVER: localhost
          DB_USER: sa
          DB_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD || 'Backup-Rehearsal-Sa-2026!' }}"
        run: sh scripts/restore-rehearsal.sh

      - name: Upload Backup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backups
          path: backups/
          retention-days: 14
