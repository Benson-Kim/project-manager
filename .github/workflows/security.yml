name: Security & Audit Workflow

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: CodeQL & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: "javascript-typescript"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # A high or critical advisory in anything that ships (production dependencies)
      # fails this job: a red run is the signal to open the Dependabot PR, not noise
      # to ignore. The dev tool chain is audited next, as a report: it never runs on a
      # server or a client PC, and its only open high today (braces, under eslint's
      # glob chain) has no fixed version to move to.
      - name: Audit Dependencies (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Dependencies (dev tool chain, report only)
        run: npm audit --audit-level=high || echo "::warning::high advisories in dev dependencies; see the audit output above"
