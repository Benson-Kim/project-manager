name: Desktop Release

# Builds the Windows installer and publishes it as a GitHub Release. Installed
# desktop apps watch this repo's latest release and offer the update
# (docs/DESKTOP.md → "Updates"). Called by ci.yml once every CI job passed on a
# push to develop (a merged PR). Skipped when nothing that reaches the app
# changed since the last release.
#
# "[force-update]" in the PR title (or the pushed commit message) makes the
# release required: installed apps warn, then restart to install it.
# "[no-release]" there publishes nothing; the next release ships the changes.

on:
  workflow_call:

jobs:
  release:
    name: Build & publish installer
    runs-on: windows-latest
    timeout-minutes: 60
    # Signing secrets live in this environment, limited to develop: ci.yml passes no
    # repository secrets to this workflow, and no other branch can read them.
    environment: desktop-release
    permissions:
      contents: write
    # One release at a time; a newer merge waits instead of racing for the version number.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # tags + history: change check and release notes

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Plan release
        id: plan
        run: node scripts/desktop/release.mjs plan

      - name: Install dependencies
        if: steps.plan.outputs.skip != 'true'
        env:
          # electron-builder downloads its own Electron build; skip the dev binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --prefer-offline

      - name: Cache SQL Server Express media
        if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: installers/sql-express
          key: sql-express-${{ hashFiles('scripts/desktop/sql-express.pin.json') }}

      # The web build and the Electron bundle run here, without the signing secrets.
      - name: Stage the app
        if: steps.plan.outputs.skip != 'true'
        env:
          PM_VERSION: ${{ steps.plan.outputs.version }}
          # Licensing: "enforce" needs both public values below; empty builds without licensing.
          PM_LICENSING: ${{ vars.PM_LICENSING }}
          PM_LICENCE_PUBLIC_KEYS: ${{ vars.PM_LICENCE_PUBLIC_KEYS }}
          PM_LICENCE_SERVICE_URL: ${{ vars.PM_LICENCE_SERVICE_URL }}
        run: node scripts/desktop/build.mjs --stage-only

      - name: Build installer
        if: steps.plan.outputs.skip != 'true'
        env:
          PM_VERSION: ${{ steps.plan.outputs.version }}
          PM_UPDATE_GITHUB: ${{ github.repository }}
          # Public feed for testers instead of this repository's releases (empty = GitHub).
          PM_UPDATE_URL: ${{ vars.PM_UPDATE_URL }}
          # Code signing (ADR-0034), one method: Microsoft Trusted Signing, an OV certificate
          # held by the CA's signing tool, or the self-issued PFX for the bridging release.
          PM_AZURE_SIGN_ENDPOINT: ${{ vars.PM_AZURE_SIGN_ENDPOINT }}
          PM_AZURE_SIGN_ACCOUNT: ${{ vars.PM_AZURE_SIGN_ACCOUNT }}
          PM_AZURE_SIGN_PROFILE: ${{ vars.PM_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PM_SIGN_CERT_SHA1: ${{ vars.PM_SIGN_CERT_SHA1 }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          PM_PUBLISHER: ${{ vars.PM_PUBLISHER }}
          PM_NEXT_PUBLISHER: ${{ vars.PM_NEXT_PUBLISHER }}
          # Set to "true" only for a release that is meant to ship unsigned.
          PM_ALLOW_UNSIGNED_RELEASE: ${{ vars.PM_ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -z "$PM_AZURE_SIGN_ACCOUNT$PM_SIGN_CERT_SHA1$CSC_LINK" ]; then
            if [ "$PM_ALLOW_UNSIGNED_RELEASE" != "true" ]; then
              echo "::error::No signing is configured in the desktop-release environment, so this release would be unsigned and installed apps would refuse it. Set up signing (docs/RELEASE-CHECKLIST.md), or set PM_ALLOW_UNSIGNED_RELEASE=true to ship unsigned on purpose."
              exit 1
            fi
            echo "::warning::Unsigned installer shipped on purpose (PM_ALLOW_UNSIGNED_RELEASE): installed apps will not verify this release's signature."
          fi
          node scripts/desktop/build.mjs --package-only

      - name: Verify installer signature
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PM_PUBLISHER: ${{ vars.PM_PUBLISHER }}
          PM_ALLOW_UNSIGNED_RELEASE: ${{ vars.PM_ALLOW_UNSIGNED_RELEASE }}
        run: |
          allow=""
          if [ "$PM_ALLOW_UNSIGNED_RELEASE" = "true" ]; then allow="--allow-unsigned"; fi
          node scripts/desktop/verify-signature.mjs $allow "dist-installer/Modulus-Setup-${VERSION}.exe"

      - name: Update policy and release notes
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          LATEST_RELEASE: ${{ steps.plan.outputs.latest_release }}
          FORCE: ${{ steps.plan.outputs.force }}
        run: node scripts/desktop/release.mjs finalize

      - name: Publish GitHub Release
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          exe="dist-installer/Modulus-Setup-${VERSION}.exe"
          gh release create "v${VERSION}" \
            "$exe" "$exe.blockmap" "$exe.sha256" dist-installer/latest.yml \
            --target "${GITHUB_SHA}" \
            --title "Modulus ${VERSION}" \
            --notes-file dist-installer/release-notes.md \
            --latest

      - name: Remove old releases
        if: steps.plan.outputs.skip != 'true'
        env:
          # Older releases stay for differential downloads from PCs a few versions behind.
          KEEP_RELEASES: "10"
        run: node scripts/desktop/release.mjs prune
