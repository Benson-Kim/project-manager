# Local development: SQL Server 2022 + the Next.js app.
# Copy .env.example to .env first. Apply the schema and the app's login with
# scripts/db-apply.sh (as sa) before the app container can connect.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set in .env}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # The VAPID public key must reach the build stage so Next.js can inline
        # it into the client bundle (NEXT_PUBLIC_* are baked at compile time,
        # not at runtime).  The key is the public half of an asymmetric pair and
        # is safe to pass as a build argument.
        NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: "${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY:-}"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DB_SERVER: mssql
      DB_PORT: "1433"
      DB_NAME: ProjectManager
      # The app's own login (ADR-0033): EXECUTE on the stored procedures and nothing else.
      # scripts/db-apply.sh creates it from the same two values; sa stays with the
      # operator's scripts.
      DB_USER: "${DB_APP_USER:-pm_web}"
      DB_PASSWORD: "${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}"
      # Stock SQL Server image uses a self-signed TLS certificate; set this to
      # "true" so the app trusts it in the bundled Compose environment.
      # Never set in real production — mount a CA-signed certificate instead.
      TRUST_SERVER_CERT: "true"
      # >= 32 random bytes (openssl rand -base64 32); no default — real
      # sessions require a real secret even in local dev (module #4).
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env — openssl rand -base64 32}"
      # The public origin users type (ADR-0032): Auth.js builds its callback and
      # redirect URLs from it instead of the request's Host header.
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      # Repeated here as a runtime env var for completeness; Next.js does NOT
      # read NEXT_PUBLIC_* at runtime — the build-arg above (build.args) is what
      # actually inlines the value into the client bundle.  Operators can safely
      # omit this runtime entry; it is kept so `docker inspect` shows the full
      # key set in one place.
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: "${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_VAPID_SUBJECT: "${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@example.test}"
      ALERT_PUSH_DISPATCH_TOKEN: "${ALERT_PUSH_DISPATCH_TOKEN:-}"
      # Attachments (ADR-0026): the bytes live on the uploads volume below.
      UPLOADS_DIR: /app/uploads
      UPLOADS_QUOTA_MB_PER_PROJECT: "${UPLOADS_QUOTA_MB_PER_PROJECT:-2048}"
      UPLOADS_MIN_FREE_MB: "${UPLOADS_MIN_FREE_MB:-2048}"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  mssql-data:
  uploads:
